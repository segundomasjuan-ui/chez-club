.glow{position:absolute;inset:0;background:radial-gradient(70% 42% at 50% 30%,rgba(209,154,107,.15),transparent 70%);pointer-events:none}
.col{position:relative;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:206px;max-width:58vw;height:auto;display:block;margin-bottom:26px}
.title{font-weight:700;font-size:1.9rem;letter-spacing:.02em;color:#d29a6b;margin:2px 0 2px}

.link:active{transform:translateY(1px)}
.socials{display:flex;gap:26px;justify-content:center;margin-top:34px}
.ico{display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#d29a6b;text-decoration:none;transition:color .15s,transform .1s}
.ico:hover{color:#f1ded0;transform:translateY(-2px)}
.ico svg{width:26px;height:26px;display:block}
.foot{margin-top:38px;font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(232,207,184,.45)}
#cfgTitulo,#cfgFooter{display:none}

  async function rpc(fn,args){
    const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{'Content-Type':'application/json','apikey':ANON,'Authorization':'Bearer '+ANON},body:JSON.stringify(args||{})});
    if(!r.ok) throw new Error(await r.text()); return r.json();
  }
  function showIf(id,v){ var e=document.getElementById(id); if(!e) return; if(v){ e.textContent=v; e.style.display=''; } else { e.style.display='none'; } }
  function hasScheme(v){ return /^[a-z][a-z0-9+.\-]*:/i.test(v); }
  function normLink(v){ return v && !hasScheme(v) ? 'https://'+v : v; }
  function normMail(v){ if(!v||hasScheme(v)) return v; return v.indexOf('@')>-1 ? 'mailto:'+v : v; }
  function hrefC(id,v){ var e=document.getElementById(id); if(e&&v) e.setAttribute('href',v); }

    hrefC('s-ig',normLink(cfg.ig_url)); hrefC('s-mail',normMail(cfg.email_url)); hrefC('s-spotify',normLink(cfg.spotify_url));
    if(links.length){
      var box=document.getElementById('links'); box.innerHTML='';
      links.forEach(function(l){
        var a=document.createElement('a'); a.className='link'; a.href=normLink(l.url)||'#';
        a.target='_blank'; a.rel='noopener'; a.textContent=l.label||'';
        box.appendChild(a);
      });
    }
  }).catch(function(){ /* deja los links de fallback del HTML */ });
</script>
