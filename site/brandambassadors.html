const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dt=k=>new Date(k+'T12:00:00');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fechaCorta=k=>{const[y,m,d]=k.split('-');return d+'/'+m+'/'+y;};
const nocheLbl=k=>{const d=dt(k);return cap(DOW[d.getDay()])+' '+d.getDate()+' de '+MES[d.getMonth()];};

const TBG=(px,op)=>'position:absolute;inset:0;background-image:url('+TRAMA1+');background-size:'+px+'px auto;opacity:'+op;

function spin(on){ $('#spin').classList.toggle('hidden',!on); }
let toastT=null;
function toast(title,sub){ const t=$('#toast');
  t.innerHTML='<div style="background:#5a0000;color:#e8cfb8;padding:16px 20px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 30px rgba(90,0,0,.3);animation:chezToast .35s ease-out;font-family:Optima,serif"><span style="width:8px;height:8px;border-radius:50%;background:#d9578a;flex:none"></span><div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:13px;letter-spacing:.2em;text-transform:uppercase">'+esc(title)+'</span>'+(sub?'<span style="font-size:13px;color:#d19b6b">'+esc(sub)+'</span>':'')+'</div></div>';
  t.classList.remove('hidden'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hidden'),4600);
}

const S={ token:localStorage.getItem(TOKKEY)||'', ba:null, boot:null, calBase:new Date(), calBaseSet:false, hoy:null,
          screen:'calendar', nightKey:null, nightData:null, tab:'lista', clientes:null, cliQ:'', cliFilter:'todos', cliOpen:null, topPeriod:'general',
          resPeriod:'mes', resDesde:null, resHasta:null, res:null };

function liveJoin(){
  if(!SB||chLive) return;
  chLive=SB.channel('chez-live',{config:{broadcast:{self:false}}});
  chLive.on('broadcast',{event:'refresh'},()=>{ clearTimeout(liveTimer); liveTimer=setTimeout(refreshLive,350); });
  chLive.subscribe();
}
function liveNotify(){ if(chLive){ try{ chLive.send({type:'broadcast',event:'refresh',payload:{}}); }catch(e){} } }
function isBusy(){
  var a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')) return true;
  if(document.querySelector('.sellForm:not(.hidden)')) return true;
  var gp=document.getElementById('gPaste'); if(gp && !gp.classList.contains('hidden')) return true;
  return false;
}
function refreshLive(){
  if(!S.token) return;                                     // sin login no refresca (evita el reload del login)
  if($('#app').classList.contains('hidden')) return;       // en login/bienvenida no refresca
  if(isBusy()) return;                                     // nunca pisa lo que estás escribiendo
  if(S.screen==='night'&&S.nightKey) loadNight(S.nightKey,true);
  else if(S.screen==='calendar') boot(true);
  else if(S.screen==='clientes') loadClientes(true);
  else if(S.screen==='resumen') loadResumen(true);
}
setInterval(refreshLive,15000);

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault(); $('#liErr').textContent='';
  const email=$('#liUser').value.trim(), pass=$('#liPass').value; if(!email||!pass) return;
  spin(true);
  try{
    const r=await rpc('ba_login',{p_email:email,p_pass:pass});
    if(!r.ok){ $('#liErr').textContent=r.mensaje||'No se pudo ingresar.'; return; }
    S.token=r.token; S.ba=r.ba; localStorage.setItem(TOKKEY,S.token);
    $('#login').classList.add('hidden');
    $('#wName').textContent=S.ba.nombre;
    $('#welcome').classList.remove('hidden');
  }catch(err){ $('#liErr').textContent='Error de conexión. Probá de nuevo.'; }
  finally{ spin(false); }
});
$('#wGo').onclick=()=>{ $('#welcome').classList.add('hidden'); enterApp(); };
$('#logout').onclick=async()=>{ try{ await rpc('ba_logout',{p_token:S.token}); }catch(e){} localStorage.removeItem(TOKKEY); location.reload(); };
$('#goCal').onclick=()=>{ S.screen='calendar'; render(); };

function enterApp(){ $('#login').classList.add('hidden'); $('#welcome').classList.add('hidden'); $('#app').classList.remove('hidden'); liveJoin(); boot(); }

async function boot(silent){
  if(!silent) spin(true);
  try{
    const r=await rpc('ba_bootstrap',{p_token:S.token});
    if(!r.ok){ localStorage.removeItem(TOKKEY); location.reload(); return; }
    S.boot=r; S.ba=r.ba; S.hoy=r.hoy;
    if(!S.calBaseSet){ S.calBase=dt(r.hoy); S.calBaseSet=true; }
    render();
  }catch(e){ if(!silent) toast('Error de conexión'); }
  finally{ if(!silent) spin(false); }
}
function nightsMap(){ const m={}; (S.boot&&S.boot.noches||[]).forEach(n=>m[n.fecha]=n); return m; }
function render(){
  if(S.screen==='calendar') viewCalendar();
  else if(S.screen==='night') viewNight();
  else if(S.screen==='clientes') viewClientes();
  else if(S.screen==='resumen') viewResumen();
}

function nightTabBar(active){
  if(!S.nightKey) return '';
  const tabs=[['lista','Lista'],['mesas','Mesas'],['previa','Previa'],['clientes','Clientes'],['resumen','Resumen del mes']];
  return '<nav style="display:flex;gap:4px;border-bottom:1px solid rgba(124,0,30,.25);overflow-x:auto;margin-bottom:22px">'+tabs.map(t=>{const on=active===t[0];return '<button class="tbtn" data-t="'+t[0]+'" style="flex:none;background:'+(on?BORDO:'transparent')+';color:'+(on?CHAMP:BORDO)+';border:none;padding:0 20px;min-height:46px;font-family:Optima,serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;white-space:nowrap">'+t[1]+'</button>';}).join('')+'</nav>';
}
function wireNightTabs(){
  document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{ const t=b.dataset.t;
    if(t==='clientes'){ S.tab='clientes'; S.screen='clientes'; loadClientes(); }
    else if(t==='resumen'){ S.tab='resumen'; S.screen='resumen'; loadResumen(); }
    else { S.tab=t; S.screen='night'; loadNight(S.nightKey); } });
}
function viewCalendar(){
  const base=S.calBase,y=base.getFullYear(),mo=base.getMonth(),nm=nightsMap();
  const first=new Date(y,mo,1),offset=(first.getDay()+6)%7,ndays=new Date(y,mo+1,0).getDate();
  let cells='';
  for(let i=0;i<offset;i++) cells+='<div style="min-height:84px"></div>';
  for(let d=1;d<=ndays;d++){

function parseList(text){
  return String(text||'').split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ l=l.replace(/^\d{1,3}\s*[\.\)\-]\s*/,''); const m=l.match(/\d{1,2}\.?\d{3}\.?\d{3}/),dni=m?m[0].replace(/\./g,''):''; const name=(m?l.replace(m[0],''):l).replace(/[·\-–,;|:()]+/g,' ').replace(/\s+/g,' ').trim(); return {nombre:name,dni}; }).filter(g=>g.nombre.length>=2);
}

async function subirComprobante(mid,file){
  if(!SB){ toast('No se pudo subir'); return; } spin(true);
  try{ const ext=(file.name.split('.').pop()||'dat').toLowerCase(); const path=S.ba.id+'/'+S.nightKey+'-mesa'+mid+'-'+Date.now()+'.'+ext;
    const up=await SB.storage.from('comprobantes').upload(path,file,{upsert:true}); if(up.error){ toast('No se pudo subir el archivo'); return; }
    const url=SB.storage.from('comprobantes').getPublicUrl(path).data.publicUrl;
    const r=await rpc('ba_set_comprobante',{p_token:S.token,p_fecha:S.nightKey,p_mesa_id:mid,p_url:url,p_nombre:file.name});
    if(!r.ok){ toast(r.mensaje||'Error'); return; } toast('Comprobante guardado'); liveNotify(); await loadNight(S.nightKey,true);
  }catch(e){ toast('Error al subir'); } finally{ spin(false); }
}

  document.querySelectorAll('.cfil').forEach(b=>b.onclick=()=>{ S.cliFilter=b.dataset.f; S.cliOpen=null; viewClientes(); });

  document.querySelectorAll('.cSave').forEach(b=>b.onclick=async()=>{ const box=b.closest('.cBox'); await saveCliente(b.dataset.dni,$('.cTel',box).value,$('.cIg',box).value,$('.cNota',box).value); });
  document.querySelectorAll('.topcard,.toprow').forEach(b=>b.onclick=()=>{ S.cliFilter='todos'; S.cliQ=''; S.cliOpen=b.dataset.id; viewClientes(); });
  document.querySelectorAll('.tperiod').forEach(b=>b.onclick=()=>{ S.topPeriod=b.dataset.p; viewClientes(); });
}
function renderTop(all){
  const h=dt(S.hoy); const cutoff={general:'0000-01-01',mes:ymd(new Date(h.getFullYear(),h.getMonth()-1,h.getDate())),tres:ymd(new Date(h.getFullYear(),h.getMonth()-3,h.getDate()))}[S.topPeriod];
  const ranked=all.map(c=>{ const hs=(c.historial||[]).filter(x=>x.fecha<S.hoy&&x.fecha>=cutoff); return {c,n:hs.length,spent:hs.reduce((a,x)=>a+(Number(x.monto)||0),0),last:hs.length?hs.reduce((a,x)=>x.fecha>a?x.fecha:a,''):''}; }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n||b.spent-a.spent||a.c.nombre.localeCompare(b.c.nombre)).slice(0,10);
  const maxN=ranked.length?ranked[0].n:1;
  const periods=[['general','General'],['mes','Último mes'],['tres','Últimos 3 meses']];
  const podium=ranked.slice(0,3).map((x,i)=>'<button class="topcard" data-id="'+esc(x.c.dni||x.c.nombre)+'" style="position:relative;overflow:hidden;background:'+BORDO+';color:'+CHAMP+';border:none;padding:24px 22px;text-align:left;cursor:pointer;font-family:Optima,serif;display:flex;flex-direction:column;gap:14px;min-height:200px">'+
    '<div style="'+TBG(700,'.3')+'"></div>'+
    '<div style="position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><span style="font-size:54px;line-height:.9;color:'+DORADO+'">'+(i+1)+'</span><img src="'+LOGO3D+'" alt="" style="width:30px;height:auto;display:block;opacity:.9"></div>'+
    '<div style="position:relative;display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;color:#f7efe7">'+esc(x.c.nombre)+'</span><span style="font-size:13px">DNI '+fmtDni(x.c.dni)+'</span></div>'+
    '<div style="position:relative;display:flex;flex-direction:column;gap:6px;margin-top:auto"><span style="font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:'+DORADO+'">'+x.n+(x.n===1?' asistencia':' asistencias')+'</span><span style="font-size:13px">'+(x.spent?money(x.spent)+' en compras':'Sin compras')+'</span></div></button>').join('');
  const rest=ranked.slice(3).map((x,i)=>'<button class="toprow" data-id="'+esc(x.c.dni||x.c.nombre)+'" style="display:grid;grid-template-columns:40px minmax(0,1.4fr) minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:center;min-height:60px;background:none;border:none;border-bottom:1px solid rgba(124,0,30,.14);padding:0;text-align:left;cursor:pointer;font-family:Optima,serif;color:'+BORDO+'"><span style="font-size:22px;color:'+DORADO+'">'+(i+4)+'</span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-size:16px">'+esc(x.c.nombre)+'</span><span style="font-size:12px;color:rgba(124,0,30,.65)">'+(x.last?'Última: '+fechaCorta(x.last):'')+'</span></span><span style="display:flex;align-items:center;gap:12px;min-width:0"><span style="flex:1;height:6px;background:rgba(124,0,30,.1)"><span style="display:block;height:100%;background:'+ROSA+';width:'+Math.round(x.n/maxN*100)+'%"></span></span><span style="font-size:13px;white-space:nowrap">'+x.n+' asist.</span></span><span style="font-size:13px;text-align:right">'+(x.spent?money(x.spent)+' en compras':'Sin compras')+'</span></button>').join('');
  return '<div style="display:flex;flex-direction:column;gap:24px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid rgba(124,0,30,.25)"><div style="font-size:12px;letter-spacing:.3em;text-transform:uppercase;padding:12px 0">Quiénes más asistieron</div><div style="display:flex;gap:4px">'+periods.map(p=>{const on=S.topPeriod===p[0];return '<button class="tperiod" data-p="'+p[0]+'" style="min-height:44px;padding:0 14px;background:none;border:none;border-bottom:2px solid '+(on?BORDO:'transparent')+';color:'+(on?BORDO:'rgba(124,0,30,.6)')+';font-family:Optima,serif;font-size:12px;letter-spacing:.16em;cursor:pointer;margin-bottom:-1px">'+p[1]+'</button>';}).join('')+'</div></div>'+
    (ranked.length?('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px">'+podium+'</div><div style="display:flex;flex-direction:column">'+rest+'</div>'):'<div style="padding:36px 0;text-align:center;font-style:italic;color:rgba(124,0,30,.6)">Todavía no hay asistencias en este período.</div>')+
  '</div>';
}
async function saveCliente(dni,tel,ig,nota){ if(!dni){ toast('Sin DNI','No puedo guardar notas de este cliente'); return; } spin(true);
  try{ const r=await rpc('ba_set_cliente',{p_token:S.token,p_dni:dni,p_tel:tel,p_ig:ig,p_nota:nota}); if(r.ok){ toast('Contacto guardado'); await loadClientes(true);} else toast(r.mensaje||'Error'); } catch(e){ toast('Error de conexión'); } finally{ spin(false); } }

function periodRange(p){ const h=dt(S.hoy),y=h.getFullYear(),m=h.getMonth();
  if(p==='mes') return [ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];
  if(p==='anterior') return [ymd(new Date(y,m-1,1)),ymd(new Date(y,m,0))];
  if(p==='tres') return [ymd(new Date(y,m-2,1)),ymd(new Date(y,m+1,0))];
  if(p==='total') return ['2000-01-01','2100-01-01'];
  return [S.resDesde||ymd(new Date(y,m,1)),S.resHasta||ymd(new Date(y,m+1,0))];
}
async function loadResumen(silent){ S.screen='resumen'; const r0=periodRange(S.resPeriod); if(!silent) spin(true);
  try{ const r=await rpc('ba_resumen',{p_token:S.token,p_desde:r0[0],p_hasta:r0[1]}); if(r.ok){ S.res=r; render(); } else toast(r.mensaje||'Error'); } catch(e){ if(!silent) toast('Error de conexión'); } finally{ if(!silent) spin(false); } }

function viewResumen(){
  const r=S.res; if(!r) return;
  const periods=[['mes','Mes actual'],['anterior','Mes anterior'],['tres','Últimos 3'],['total','Total'],['custom','Rango']];
  const mesaRows=(r.mesas||[]).map(x=>'<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;min-height:48px;border-bottom:1px solid rgba(124,0,30,.14);font-size:15px"><span>'+fechaCorta(x.fecha)+'</span><span>'+esc(x.mesa)+(x.categoria?(' · '+esc(x.categoria)):'')+'</span><span>'+money(x.monto)+'</span><span style="font-weight:500">'+money(x.comision)+'</span></div>').join('')||'<div style="padding:22px 0;font-style:italic;color:rgba(124,0,30,.6)">Sin mesas vendidas en el período.</div>';
  const prevRows=(r.previas||[]).map(x=>'<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;min-height:48px;border-bottom:1px solid rgba(124,0,30,.14);font-size:15px"><span>'+fechaCorta(x.fecha)+'</span><span>'+esc(x.titular)+' ('+x.pax+')</span><span>'+money(x.monto)+'</span><span style="font-weight:500">'+money(x.comision)+'</span></div>').join('')||'<div style="padding:22px 0;font-style:italic;color:rgba(124,0,30,.6)">Sin previas en el período.</div>';
  const META=1000000, nB=Math.floor((r.total_vendido||0)/META), resto=(r.total_vendido||0)%META, pct=Math.round(resto/META*100);
  const bottles=Array.from({length:Math.min(nB,8)},()=>'<div style="width:44px;height:44px;border-radius:50%;background:'+CHAMP+';display:grid;place-items:center"><img src="'+LOGO3B+'" alt="" style="width:24px;height:auto;display:block"></div>').join('');
  const mesaCount=(r.mesas||[]).length, prevCount=(r.previas||[]).length;
  $('#view').innerHTML=
    baHeader('Resumen · comisión '+r.comision_pct+'%','rBack')+nightTabBar('resumen')+
    '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px">'+periods.map(p=>{const on=S.resPeriod===p[0];return '<button class="rper" data-p="'+p[0]+'" style="min-height:38px;padding:0 14px;background:'+(on?BORDO:'transparent')+';color:'+(on?CHAMP:BORDO)+';border:1px solid '+(on?BORDO:'rgba(124,0,30,.35)')+';font-family:Optima,serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer">'+p[1]+'</button>';}).join('')+'</div>'+
    '<div id="rCustom" class="'+(S.resPeriod==='custom'?'':'hidden')+'" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px"><input type="date" id="rD0" value="'+esc(r.desde)+'" style="min-height:40px;border:1px solid rgba(124,0,30,.35);background:#fff;padding:0 8px;font-size:15px;color:'+BORDO+'"><span>→</span><input type="date" id="rD1" value="'+esc(r.hasta)+'" style="min-height:40px;border:1px solid rgba(124,0,30,.35);background:#fff;padding:0 8px;font-size:15px;color:'+BORDO+'"><button id="rGo" style="min-height:40px;padding:0 18px;background:transparent;border:1px solid '+BORDO+';color:'+BORDO+';font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer">Ver</button></div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:36px;align-items:start">'+
      '<div style="display:flex;flex-direction:column;gap:34px;min-width:0">'+
        '<div style="display:flex;flex-direction:column;gap:12px"><div style="font-size:12px;letter-spacing:.3em;text-transform:uppercase">Mesas vendidas</div><div style="overflow-x:auto"><div style="min-width:440px"><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:10px;padding-bottom:10px;border-bottom:1px solid '+BORDO+';font-size:11px;letter-spacing:.22em;text-transform:uppercase"><span>Fecha</span><span>Mesa</span><span>Precio</span><span>Comisión</span></div>'+mesaRows+'</div></div></div>'+
        '<div style="display:flex;flex-direction:column;gap:12px"><div style="font-size:12px;letter-spacing:.3em;text-transform:uppercase">Previas y otros</div><div style="overflow-x:auto"><div style="min-width:440px"><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:10px;padding-bottom:10px;border-bottom:1px solid '+BORDO+';font-size:11px;letter-spacing:.22em;text-transform:uppercase"><span>Fecha</span><span>Arreglo</span><span>Monto</span><span>Comisión</span></div>'+prevRows+'</div></div></div>'+
      '</div>'+
      '<aside style="position:relative;background:'+BORDO+';color:'+CHAMP+';overflow:hidden;padding:34px 30px;display:flex;flex-direction:column;gap:22px">'+
        '<div style="'+TBG(900,'.3')+'"></div>'+
        '<img src="'+LOGO3D+'" alt="" style="position:relative;width:46px;height:auto;display:block">'+
        '<div style="position:relative;display:flex;flex-direction:column">'+
          '<div style="display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(209,155,107,.4);font-size:13px;letter-spacing:.26em;text-transform:uppercase"><span>Mesas</span><span style="letter-spacing:.04em;font-size:17px">'+mesaCount+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(209,155,107,.4);font-size:13px;letter-spacing:.26em;text-transform:uppercase"><span>Previas</span><span style="letter-spacing:.04em;font-size:17px">'+prevCount+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(209,155,107,.4);font-size:13px;letter-spacing:.26em;text-transform:uppercase"><span>Personas en previas</span><span style="letter-spacing:.04em;font-size:17px">'+(r.invitados_previa||0)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid rgba(209,155,107,.4);font-size:13px;letter-spacing:.26em;text-transform:uppercase"><span>Invitados</span><span style="letter-spacing:.04em;font-size:17px">'+(r.invitados_total||0)+'</span></div>'+
        '</div>'+
        '<div style="position:relative;display:flex;flex-direction:column;gap:6px;padding-top:6px"><span style="font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:'+DORADO+'">Comisión del período</span><span style="font-size:44px;line-height:1.1;color:#f7efe7">'+money(r.comision_total)+'</span><span style="font-size:12px;color:'+CHAMP+';font-style:italic">Vendido total '+money(r.total_vendido)+' · actualizado en vivo.</span></div>'+
        '<div style="position:relative;display:flex;flex-direction:column;gap:14px;margin-top:6px;padding:22px 20px;background:'+BORDO2+';border:1px solid rgba(209,155,107,.5)">'+
          '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><span style="font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:'+DORADO+'">Chez Points</span><span style="font-size:13px;color:'+CHAMP+'">'+money(r.total_vendido)+' vendido</span></div>'+
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px">'+bottles+'<div style="width:44px;height:44px;border-radius:50%;border:1px dashed '+DORADO+';display:grid;place-items:center;font-size:18px;color:'+DORADO+'">+</div><span style="font-size:30px;line-height:1;color:#f7efe7;margin-left:6px">× '+nB+'</span></div>'+
          '<div style="display:flex;flex-direction:column;gap:8px"><div style="height:8px;background:rgba(232,207,184,.18)"><div style="height:100%;width:'+pct+'%;background:'+ROSA+'"></div></div><div style="display:flex;justify-content:space-between;gap:12px;font-size:12px;color:'+CHAMP+'"><span>Te faltan '+money(META-resto)+' para la próxima</span><span>'+pct+'%</span></div></div>'+
          '<span style="font-size:12px;color:'+CHAMP+';font-style:italic;line-height:1.5">Cada $1.000.000 vendido en mesas y previas suma una botella a elección para disfrutar en Chez Club.</span>'+
        '</div>'+
      '</aside>'+
    '</div>';
  $('#rBack').onclick=()=>{ S.screen='calendar'; render(); }; wireNightTabs();
  document.querySelectorAll('.rper').forEach(b=>b.onclick=()=>{ S.resPeriod=b.dataset.p; if(b.dataset.p==='custom') viewResumen(); else loadResumen(); });
  const go=$('#rGo'); if(go) go.onclick=()=>{ S.resDesde=$('#rD0').value; S.resHasta=$('#rD1').value; loadResumen(); };
}

if(S.token){ enterApp(); } else { $('#login').classList.remove('hidden'); }
</script>
