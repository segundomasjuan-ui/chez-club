<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes chezFlash{0%{transform:scale(.4);opacity:1}100%{transform:scale(30);opacity:0}}
@keyframes chezStamp{0%{transform:scale(1.9) rotate(-14deg);opacity:0}30%{transform:scale(1) rotate(0);opacity:.85}100%{transform:scale(1);opacity:0}}
@keyframes chezSheen{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<sc-if value="{{ featured }}" hint-placeholder-val="{{ false }}">
  <div style="position:relative;padding:5px;opacity:{{ enterOp }};transform:{{ enterTf }};transition:{{ enterTr }}">
    <a href="{{ href }}" target="{{ target }}" rel="noopener" onPointerDown="{{ onTap }}" style="position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:78px;box-sizing:border-box;padding:12px 14px 12px 12px;background:#f1ded0;color:#530001;outline:1px solid #d29a6b;outline-offset:4px;text-decoration:none;font-family:var(--chez-sans, Optima, 'Belleza', sans-serif);transition:transform 160ms ease, background 200ms ease;-webkit-tap-highlight-color:transparent" style-hover="background:#f8ebe0;color:#530001" style-active="transform:scale(.985)">
      <span aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(105deg, transparent 38%, rgba(255,250,244,.8) 50%, transparent 62%);transform:translateX(-120%);animation:chezSheen 1.3s ease 1.2s 1 both;pointer-events:none"></span>
      <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ true }}">
        <span style="position:relative;flex:none;width:50px;height:50px;border-radius:50%;background:#530001;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #d29a6b">
          <svg width="24" height="24" viewBox="0 0 24 24" style="fill:none;stroke:#d29a6b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="{{ iconD }}"></path></svg>
        </span>
      </sc-if>
      <span style="position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:19px;font-weight:700;line-height:1.15;letter-spacing:.01em;text-wrap:pretty">{{ title }}</span>
        <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:13.5px;line-height:1.3;color:#7c001e;text-wrap:pretty">{{ subtitle }}</span>
        </sc-if>
      </span>
      <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ true }}">
        <span style="position:relative;flex:none;padding:9px 11px;background:#530001;color:#f1ded0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700">{{ cta }}</span>
      </sc-if>
      <sc-if value="{{ noCta }}" hint-placeholder-val="{{ false }}">
        <svg width="22" height="22" viewBox="0 0 24 24" style="position:relative;flex:none;fill:none;stroke:#530001;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M4 12h15 M14 7l5 5-5 5"></path></svg>
      </sc-if>
      {{ fx }}
    </a>
  </div>
</sc-if>
<sc-if value="{{ normal }}" hint-placeholder-val="{{ true }}">
  <div style="position:relative;opacity:{{ enterOp }};transform:{{ enterTf }};transition:{{ enterTr }}">
    <span aria-hidden="true" style="position:absolute;left:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;background:#d29a6b;transform:rotate(45deg);z-index:1"></span>
    <span aria-hidden="true" style="position:absolute;right:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;background:#d29a6b;transform:rotate(45deg);z-index:1"></span>
    <a href="{{ href }}" target="{{ target }}" rel="noopener" onPointerDown="{{ onTap }}" style="position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:64px;box-sizing:border-box;padding:10px 16px 10px 10px;background:rgba(124,0,30,.55);border:1px solid rgba(210,154,107,.6);color:#f1ded0;text-decoration:none;font-family:var(--chez-sans, Optima, 'Belleza', sans-serif);transition:transform 160ms ease, background 200ms ease, border-color 200ms ease;-webkit-tap-highlight-color:transparent" style-hover="border-color:#d29a6b;background:rgba(124,0,30,.9);color:#f1ded0" style-active="transform:scale(.985)">
      <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ true }}">
        <span style="flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(210,154,107,.75)">
          <svg width="22" height="22" viewBox="0 0 24 24" style="fill:none;stroke:#d29a6b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="{{ iconD }}"></path></svg>
        </span>
      </sc-if>
      <sc-if value="{{ noIcon }}" hint-placeholder-val="{{ false }}">
        <span style="flex:none;width:6px"></span>
      </sc-if>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:17px;font-weight:600;line-height:1.2;letter-spacing:.01em;text-wrap:pretty">{{ title }}</span>
        <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}">
          <span style="font-size:13px;line-height:1.3;color:#e8cfb8;text-wrap:pretty">{{ subtitle }}</span>
        </sc-if>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" style="flex:none;fill:none;stroke:#d29a6b;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M4 12h15 M14 7l5 5-5 5"></path></svg>
      {{ fx }}
    </a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:110},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Precios y mesas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Reservá tu mesa para el finde&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;coupe&quot;,&quot;vinyl&quot;,&quot;pin&quot;,&quot;heart&quot;,&quot;cassette&quot;,&quot;key&quot;,&quot;cd&quot;,&quot;seal&quot;],&quot;default&quot;:&quot;coupe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;featured&quot;,&quot;normal&quot;],&quot;default&quot;:&quot;featured&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Reservá&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;delay&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;shown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;reduced&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const ICONS = {
  coupe: 'M5 4h14c0 4-3 7-7 7s-7-3-7-7z M12 11v8 M8 20h8 M7 6.5h10',
  vinyl: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0 M10 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M6.5 12a5.5 5.5 0 0 1 3-4.9',
  pin: 'M12 21s-6-6.2-6-11a6 6 0 0 1 12 0c0 4.8-6 11-6 11z M10 10a2 2 0 1 0 4 0a2 2 0 1 0-4 0',
  heart: 'M12 19C7 15.5 4.5 12.6 5.6 9.4 6.6 6.6 10 6.3 12 9c2-2.7 5.4-2.4 6.4.4 1.1 3.2-1.4 6.1-6.4 9.6z M2 13c2 2 3.5 1 4.5-.5 M22 13c-2 2-3.5 1-4.5-.5',
  cassette: 'M3 6h18v12H3z M7 18l1.5-3h7l1.5 3 M6.5 10.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0 M14.5 10.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0 M9.5 10.5h5',
  key: 'M3 12a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0 M10 12h11 M17.5 12v3 M20.5 12v2.5',
  cd: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0 M10 12a2 2 0 1 0 4 0a2 2 0 1 0-4 0 M12 5.5a6.5 6.5 0 0 1 6.5 6.5',
  seal: 'M12 3l2 1.5 2.5-.3 1 2.3 2.2 1.2-.3 2.5L21 12l-1.6 1.8.3 2.5-2.2 1.2-1 2.3-2.5-.3L12 21l-2-1.5-2.5.3-1-2.3-2.2-1.2.3-2.5L3 12l1.6-1.8-.3-2.5 2.2-1.2 1-2.3 2.5.3z'
};
class Component extends DCLogic {
  state = { fx: [] };
  n = 0;
  tap = (e) => {
    if (this.props.reduced) return;
    const r = e.currentTarget.getBoundingClientRect();
    const id = ++this.n;
    const f = { id, x: e.clientX - r.left, y: e.clientY - r.top };
    this.setState(s => ({ fx: [...s.fx, f] }));
    setTimeout(() => this.setState(s => ({ fx: s.fx.filter(x => x.id !== id) })), 700);
  };
  renderVals() {
    const p = this.props;
    const featured = p.variant === 'featured';
    const shown = (p.shown ?? true) || p.reduced;
    const delay = p.delay ?? 0;
    const d = ICONS[p.icon];
    const href = p.href ?? '#';
    const nodes = [];
    this.state.fx.forEach(f => {
      nodes.push(React.createElement('span', { key: 'f' + f.id, style: { position: 'absolute', left: f.x, top: f.y, width: 16, height: 16, marginLeft: -8, marginTop: -8, borderRadius: '50%', pointerEvents: 'none', background: 'radial-gradient(circle, rgba(255,246,236,.95) 0%, rgba(210,154,107,.7) 35%, rgba(210,154,107,0) 70%)', animation: 'chezFlash 600ms cubic-bezier(.2,.7,.2,1) forwards' } }));
      if (featured) nodes.push(React.createElement('span', { key: 's' + f.id, style: { position: 'absolute', left: f.x, top: f.y, width: 46, height: 46, marginLeft: -23, marginTop: -23, borderRadius: '50%', pointerEvents: 'none', border: '2px solid #7c001e', boxShadow: 'inset 0 0 0 4px rgba(124,0,30,.25)', animation: 'chezStamp 560ms ease-out forwards' } }));
    });
    return {
      featured, normal: !featured,
      title: p.title ?? 'Precios y mesas',
      subtitle: p.subtitle, hasSub: !!p.subtitle,
      iconD: d, hasIcon: !!d, noIcon: !d,
      cta: p.cta, hasCta: !!p.cta, noCta: !p.cta,
      href, target: /^https?:/.test(href) ? '_blank' : undefined,
      enterOp: shown ? 1 : 0,
      enterTf: shown ? 'none' : 'translateY(18px) rotate(-1.4deg)',
      enterTr: p.reduced ? 'none' : `opacity 420ms ease ${delay}ms, transform 560ms cubic-bezier(.2,.8,.2,1) ${delay}ms`,
      onTap: this.tap,
      fx: React.createElement(React.Fragment, null, ...nodes)
    };
  }
}
</script>
</body>
</html>
